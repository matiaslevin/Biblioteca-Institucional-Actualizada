<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imagenes/logo2.png" type="image/x-icon">
    <title>
        Acceso Institucional - Biblioteca Digital
    </title>

    <!-- Boostrap -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    >

    <link rel="stylesheet" href="styleCRA.css">
    <script src="data/transiciones.js"></script>

</head>

<body>

    <!-- Barra superior -->
    <header class="top-bar">

        <img
            src="imagenes/logo2.png"
            alt="Logo"
            class="top-logo"
        >

        <div class="top-bar-content">

            <h2>
                SISTEMA DE BIBLIOTECA DIGITAL INSTITUCIONAL
          </h2>

        </div>

        <!-- Boton boostrap -->
        <button
            id="theme-button"
            class="theme-switch btn btn-outline-light"
        >
            ☀️/🌙
        </button>

    </header>

    <!-- Boostrap  -->
    <div class="container-fluid page-container">

        <div class="row justify-content-center w-100">

            <div class="col-lg-4 col-md-6 col-sm-10">

                <!-- boostrap card -->
                <div class="login-card shadow-lg">

                    <header class="login-header">

                        <img
                            src="imagenes/logo2.png"
                            alt="Logo Liceo"
                            class="formal-logo"
                        >

                        <h1>
                            Biblioteca Digital
                        </h1>

                        <div class="divider"></div>

                        <!-- Alerta de boostrap. -->
                        <div class="alert alert-secondary py-2 mt-3">

                            Portal de Acceso Institucional · CRA

                        </div>

                    </header>

                    <form class="formal-form" action="tablaBibliotecaCRA.html">

                        <!-- input bosstrap -->
                        <div class="input-container">

                            <input
                                type="text"
                                id="user"
                                name="user"
                                placeholder=" "
                                required
                                class="formal-input form-control"
                                pattern="SLEP2026"
                                title="Usuario incorrecto"
                            >

                            <label for="user" class="formal-label">
                                Nombre de Usuario
                            </label>

                        </div>

                        <div class="input-container">

                            <input
                                type="password"
                                id="pass"
                                name="pass"
                                placeholder=" "
                                required
                                class="formal-input form-control"
                                pattern="SLEPGM"
                                title="Contraseña incorrecta"
                            >

                            <label for="pass" class="formal-label">
                                Contraseña
                            </label>

                        </div>

                        <!-- boton boostrap -->
                        <button
                            type="submit"
                            class="submit-button btn btn-primary w-100"
                        >
                            INICIAR SESIÓN
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>
<script>

const body = document.body;

if(localStorage.getItem("modo") === "oscuro"){
    body.classList.add("dark-mode");
}

document.getElementById("theme-button").addEventListener("click", () => {

    body.classList.toggle("dark-mode");

    if(body.classList.contains("dark-mode")){
        localStorage.setItem("modo", "oscuro");
    }
    else{
        localStorage.setItem("modo", "claro");
    }

});

</script>

</body>
</html>

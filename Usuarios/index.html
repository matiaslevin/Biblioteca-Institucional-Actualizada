<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="index">
<link rel="icon" href="imagenes/logo2.png" type="image/x-icon">

<title>Menú Biblioteca</title>

<!-- Boostrap -->
<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link rel="stylesheet" href="categoriaUS.css">
<script src="data/transiciones.js"></script>
</head>

<body>

<!-- Barra superior -->
<header class="top-bar">

    <img
        src="imagenes/logo2.png"
        alt="Logo"
        class="top-logo"
    >

    <div class="top-bar-content">

        <h2>
            SISTEMA DE BIBLIOTECA DIGITAL INSTITUCIONAL
        </h2>

    </div>

</header>

<!-- Contenedor -->
<div class="page-container container">

    <!-- Bienvenida -->
    <div class="welcome-section">

        <h1>Bienvenido a la Biblioteca Digital</h1>

        <p>Explora nuestras categorías y descubre tu próxima lectura</p>
        
        <a href="reglas.html" class="link-reglas"> 📋 Reglas de la Biblioteca </a>

    </div>

    <!-- El buscador -->
    <div class="search-bar">

        <div class="search-box input-group shadow-sm">

            <span class="input-group-text">
                🔍
            </span>

            <input
                type="text"
                id="buscador-categorias"
                class="form-control"
                placeholder="Buscar libros..."
            >

        </div>

    </div>

    <!-- Contenido -->
    <div class="main-content">

        <div class="card-categorias shadow-lg">

            <div class="header-categorias">
                📚 Categorias
            </div>

            <ul class="lista-categorias list-group list-group-flush" id="lista-categorias">
                <!-- Se genera dinamicamente desde data/libros.js (CATEGORIAS), en orden H2 a H11 -->
            </ul>

        </div>

    </div>

</div>

<!-- Boton cambiar modo -->
<button id="theme-button" class="theme-floating btn btn-dark">
    ☀️/🌙
</button>

<!-- Base de categorias compartida -->
<script src="../data/libros.js"></script>

<!-- Script modo oscuro + generar lista + buscador -->
<script>

const body = document.body;

if(localStorage.getItem("modo") === "oscuro"){
    body.classList.add("dark-mode");
}

document.getElementById("theme-button").addEventListener("click", () => {

    body.classList.toggle("dark-mode");

    if(body.classList.contains("dark-mode")){
        localStorage.setItem("modo", "oscuro");
    }
    else{
        localStorage.setItem("modo", "claro");
    }

});

/* Colores de badge, rotando para diferenciar categorias visualmente */

const coloresBadge = [
    "bg-primary", "bg-danger", "bg-success", "bg-warning text-dark",
    "bg-info text-dark", "bg-secondary", "bg-dark"
];

/* Construir la lista de categorias en orden H2 -> H11, tal como en el menu real */

const lista = document.getElementById("lista-categorias");

CATEGORIAS.forEach((cat, index) => {

    const li = document.createElement("li");

    li.className = "list-group-item";
    li.setAttribute("data-nombre", cat.nombre.toLowerCase());

    const colorBadge = coloresBadge[index % coloresBadge.length];

    li.innerHTML = `
        <a href="bibliotecaUS.html?estante=${cat.estante}">

            <span class="icono-categoria">${cat.icono}</span>

            <span class="flecha">→</span>

            <span class="nombre-categoria">${cat.nombre}</span>

            <span class="badge ${colorBadge} rounded-pill">
                ${cat.estante}
            </span>

        </a>
    `;

    lista.appendChild(li);

});

/* Filtro simple de categorias segun lo escrito en el buscador */

document.getElementById("buscador-categorias").addEventListener("input", function(){

    const texto = this.value.trim().toLowerCase();

    document.querySelectorAll("#lista-categorias .list-group-item").forEach(item => {

        const nombre = item.getAttribute("data-nombre");

        item.style.display = nombre.includes(texto) ? "" : "none";

    });

});

</script>

</body>
</html>
